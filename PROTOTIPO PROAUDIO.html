<!--
  ===========================================================================
  PROTOTIPO DE VALIDACIÓN · PROAUDIO IBARRA · v0.1-html
  ---------------------------------------------------------------------------
  Maqueta navegable en un solo archivo. Equivalente funcional a la versión
  Next.js del mismo proyecto.

  · Datos exclusivamente ficticios.
  · Sin base de datos, sin autenticación, sin Google Calendar, sin WhatsApp,

<style>

  --am50:#fffbeb; --am100:#fef3c7; --am200:#fde68a; --am300:#fcd34d; --am700:#b45309; --am800:#92400e; --am900:#78350f;

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{

}
svg{display:block;flex:none}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}

/* ── Franja de aviso permanente ─────────────────────────────────────────── */

/* ── Cabecera ───────────────────────────────────────────────────────────── */

.usuario{display:flex;align-items:center;gap:8px;text-align:right}

.sub{font-size:14px;color:var(--s500)}

.i-reagendada{background:var(--vi50);color:var(--vi800);border-color:var(--vi300)}
.i-neutra{background:var(--s50);color:var(--s600);border-color:var(--s300);font-weight:500}
.i-ambar{background:var(--am50);color:var(--am800);border-color:var(--am300);font-weight:500}
.i-alta{background:var(--ro50);color:var(--ro800);border-color:var(--ro300)}
.i-media{background:var(--am50);color:var(--am800);border-color:var(--am300)}
.i-baja{background:var(--s100);color:var(--s600);border-color:var(--s300)}
.i-verde{background:var(--em50);color:var(--em800);border-color:var(--em300)}

.nota-gris{border-radius:8px;background:var(--s50);padding:8px 12px;font-size:12px;color:var(--s500)}

.kpi{text-align:center}
.kpi b{display:block;font-size:30px;font-weight:800;color:var(--marca-700);line-height:1.1}
.kpi span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--s500)}

.lista-div>*{border-bottom:1px solid var(--s100)}
.lista-div>*:last-child{border-bottom:none}
.item-lista{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px;text-align:left}
.item-lista:hover{background:var(--s50)}
.hora-col{width:46px;font-size:14px;font-weight:700;color:var(--s700);flex:none}

.pestanias{display:flex;flex-wrap:wrap;gap:4px;border:1px solid var(--s200);background:#fff;border-radius:12px;padding:4px}

.grupo-btn{display:flex;overflow:hidden;border:1px solid var(--s300);background:#fff;border-radius:8px}
.grupo-btn button{padding:8px 16px;font-size:14px;font-weight:600;color:var(--s600)}
.grupo-btn button:hover{background:var(--s50)}
.grupo-btn button.on{background:var(--marca-700);color:#fff}
.chip{border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;background:var(--s100);color:var(--s600)}
.chip:hover{background:var(--s200)}
.chip.on{background:var(--marca-700);color:#fff}

/* ── Agenda ─────────────────────────────────────────────────────────────── */
.scroll-x{overflow-x:auto}
table.agenda{width:100%;min-width:560px;table-layout:fixed;border-collapse:collapse}
table.agenda th{background:var(--s50);border-bottom:1px solid var(--s200);padding:8px 12px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--s500)}
table.agenda th.h{width:64px}
table.agenda td{border-bottom:1px solid var(--s100);padding:4px 8px;vertical-align:top}
table.agenda td.h{padding:6px 12px;font-size:11px;font-weight:700;color:var(--s400)}
.bloque-cita{display:block;width:100%;text-align:left;margin-bottom:4px;border-radius:8px;border-left:4px solid;padding:8px 12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.bloque-cita:hover{box-shadow:0 2px 6px rgba(0,0,0,.1)}
.bloque-cita b{display:block;font-size:14px;font-weight:600;color:var(--s800)}
.bloque-cita .m{margin-top:2px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--s500)}
.tenue{opacity:.5}
.semana{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.semana{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.semana{grid-template-columns:repeat(6,1fr)}}
.dia-hoy{box-shadow:0 0 0 2px var(--marca-600)}
.mes-cab,.mes-rej{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:560px}
.mes-cab div{padding:4px 0;text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--s400)}
.celda-mes{min-height:64px;border:1px solid var(--s200);background:#fff;border-radius:8px;padding:8px;text-align:left;font-size:14px}

.celda-mes.hoy{border-color:var(--marca-600);background:var(--marca-50)}

.pastilla{margin-top:4px;display:inline-block;border-radius:999px;background:var(--marca-100);color:var(--marca-700);padding:2px 8px;font-size:11px;font-weight:600}

/* ── Línea de tiempo ────────────────────────────────────────────────────── */
ol.tl{position:relative;margin-left:8px;border-left:2px solid var(--s200);padding-left:20px;list-style:none}
ol.tl li{position:relative;padding-bottom:16px}
ol.tl li:last-child{padding-bottom:0}
ol.tl .punto{position:absolute;left:-27px;top:6px;width:12px;height:12px;border-radius:999px;box-shadow:0 0 0 4px #fff}
ol.tl .cab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--s400)}
ol.tl .tit{font-size:14px;font-weight:600;color:var(--s800)}
ol.tl .det{margin-top:2px;font-size:14px;color:var(--s600)}
ol.tl .aut{margin-top:2px;font-size:11px;color:var(--s400)}

/* ── Fichas de paciente en lista ────────────────────────────────────────── */
a.ficha-item{display:block}
a.ficha-item .tarjeta:hover{border-color:var(--marca-600);box-shadow:0 2px 6px rgba(0,0,0,.08)}

.rec-atrasado{border-color:var(--ro300)}
.rec-destacado{box-shadow:0 0 0 2px var(--marca-600)}
.etq-atraso{border-radius:999px;background:var(--ro100);color:var(--ro700);padding:2px 8px;font-size:11px;font-weight:700}
.acciones-rec{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--s100);padding-top:10px}

function esc(s){
  if(s === null || s === undefined) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function normalizar(s){
  return String(s||"").toLowerCase().normalize("NFD")
    .split("").filter(function(ch){ var c = ch.charCodeAt(0); return c < 0x300 || c > 0x36f; })
    .join("").trim();
}
var MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var MESES_LARGO = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
var DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

function partes(iso){ var p = String(iso).split("-"); return {y:+p[0], m:+p[1], d:+p[2]}; }
function fechaCorta(iso){ if(!iso) return "—"; var p = partes(iso); return p.d + " " + MESES[p.m-1] + " " + p.y; }
function fechaLarga(iso){
  var p = partes(iso), f = new Date(p.y, p.m-1, p.d), dia = DIAS[f.getDay()];
  return dia.charAt(0).toUpperCase() + dia.slice(1) + ", " + p.d + " de " + MESES_LARGO[p.m-1] + " de " + p.y;
}
function nombreMes(m){ return MESES_LARGO[m-1]; }
function aISO(f){
  return f.getFullYear() + "-" + String(f.getMonth()+1).padStart(2,"0") + "-" + String(f.getDate()).padStart(2,"0");
}
function sumarDias(iso, n){ var p = partes(iso); return aISO(new Date(p.y, p.m-1, p.d+n)); }
function diaSemana(iso){ var p = partes(iso); return new Date(p.y, p.m-1, p.d).getDay(); }
function inicioSemana(iso){ var dw = diaSemana(iso); return sumarDias(iso, dw === 0 ? -6 : 1-dw); }
function diasEntre(a, b){
  var x = partes(a), y = partes(b);
  return Math.round((new Date(y.y,y.m-1,y.d) - new Date(x.y,x.m-1,x.d)) / 86400000);
}

function buscarPaciente(id){ for(var i=0;i<S.pacientes.length;i++) if(S.pacientes[i].id===id) return S.pacientes[i]; return null; }
function buscarCita(id){ for(var i=0;i<S.citas.length;i++) if(S.citas[i].id===id) return S.citas[i]; return null; }
function buscarRec(id){ for(var i=0;i<S.recordatorios.length;i++) if(S.recordatorios[i].id===id) return S.recordatorios[i]; return null; }
function buscarProf(id){ for(var i=0;i<PROFESIONALES.length;i++) if(PROFESIONALES[i].id===id) return PROFESIONALES[i]; return null; }
function buscarSuc(id){ for(var i=0;i<SUCURSALES.length;i++) if(SUCURSALES[i].id===id) return SUCURSALES[i]; return null; }
function nombreCompleto(p){ return p ? p.nombres + " " + p.apellidos : ""; }
function nombrePacienteId(id){ var p = buscarPaciente(id); return p ? nombreCompleto(p) : id; }
function nombreProfCorto(id){ var p = buscarProf(id); return p ? p.nombreCorto : id; }
function nombreProfLargo(id){ var p = buscarProf(id); return p ? p.nombre : id; }

function pushEvento(e){ e.id = nuevoId("EVT"); S.eventos.unshift(e); }

function crearPaciente(d){
  var p = {
    id: nuevoId("PAC"), nombres:d.nombres||"", apellidos:d.apellidos||"", telefono:d.telefono||"",
    sucursalId:d.sucursalId||"SUC-01", estado:"Paciente nuevo", estadoDigitalizacion:"Sin digitalizar",
    esNuevo:true
  };
  ["documento","telefono2","correo","ciudad","fechaNacimiento","comoConocio","referidoPor",
   "profesionalId","fichaFisica","notas"].forEach(function(k){ if(d[k]) p[k] = d[k]; });
  S.pacientes.unshift(p);
  pushEvento({pacienteId:p.id, fecha:HOY, tipo:"Ficha", titulo:"Ficha creada", autor:USUARIA_ACTUAL});
  return p;
}

function crearCita(d){
  var c = {
    id: nuevoId("CIT"), pacienteId:d.pacienteId, fecha:d.fecha, hora:d.hora,
    duracionMin:d.duracionMin, profesionalId:d.profesionalId, sucursalId:d.sucursalId,
    motivo:d.motivo, estado:"Agendada"
  };
  if(d.notas) c.notas = d.notas;
  S.citas.unshift(c);
  pushEvento({pacienteId:c.pacienteId, fecha:c.fecha, tipo:"Cita",
    titulo:"Cita agendada · "+c.motivo+" · "+c.hora+" · "+nombreProfCorto(c.profesionalId),
    detalle:"Estado: Agendada", autor:USUARIA_ACTUAL});
  return c;
}

function cambiarEstadoCita(id, estado, motivo){
  var c = buscarCita(id); if(!c) return;
  c.estado = estado;
  if(motivo) c.motivoCambio = motivo;
  if(estado === "Cancelada" || estado === "No atendida"){
    pushEvento({pacienteId:c.pacienteId, fecha:HOY, tipo:"Cita",
      titulo:"Cita "+estado.toLowerCase()+" · "+c.motivo+" · "+fechaCorta(c.fecha)+" "+c.hora,
      detalle: motivo ? "Motivo: "+motivo : undefined, autor:USUARIA_ACTUAL});
  }
}

function reagendarCita(id, nueva, motivo){
  var o = buscarCita(id); if(!o) return null;
  var n = {id:nuevoId("CIT"), pacienteId:o.pacienteId, fecha:nueva.fecha, hora:nueva.hora,
           duracionMin:o.duracionMin, profesionalId:nueva.profesionalId, sucursalId:o.sucursalId,
           motivo:o.motivo, estado:"Agendada"};
  o.estado = "Reagendada"; o.motivoCambio = motivo;
  S.citas.unshift(n);
  pushEvento({pacienteId:o.pacienteId, fecha:HOY, tipo:"Reagendamiento",
    titulo:"Cita reagendada: de "+fechaCorta(o.fecha)+" "+o.hora+" a "+fechaCorta(nueva.fecha)+" "+nueva.hora,
    detalle:"Motivo: "+motivo+". La cita original queda en el historial.", autor:USUARIA_ACTUAL});
  return n;
}

function registrarAtencion(d){
  var a = {id:nuevoId("ATN"), fecha:HOY, profesionalId:"PRO-01", pacienteId:d.pacienteId,
           citaId:d.citaId, tipo:d.tipo, observacion:d.observacion, indicacion:d.indicacion,
           proximaAccion:d.proximaAccion, fechaSeguimiento:d.fechaSeguimiento,
           responsableId:d.responsableId, documentoAdjunto:d.documentoAdjunto};
  S.atenciones.unshift(a);
  if(d.citaId){ var c = buscarCita(d.citaId); if(c) c.estado = "Completada"; }
  var p = buscarPaciente(d.pacienteId);
  if(p){
    p.ultimaVisita = HOY;
    if(d.indicacion) p.ultimaIndicacion = d.indicacion;
    if(d.proximaAccion) p.proximaAccion = d.proximaAccion;
    p.esNuevo = false;
  }
  pushEvento({pacienteId:d.pacienteId, fecha:HOY, tipo:"Atención", titulo:"Atención · "+d.tipo,
    detalle:'Observación: "'+d.observacion+'"'+(d.indicacion ? ' · Indicación: "'+d.indicacion+'"' : ""),
    autor:USUARIA_ACTUAL});
  if(d.proximaAccion){
    var r = {id:nuevoId("REC"), tipo:"Seguimiento posterior a la atención",
             categoria:"Tarea para recepción", pacienteId:d.pacienteId,
             motivo:d.proximaAccion+" (definido al registrar la atención de hoy).",
             fecha:d.fechaSeguimiento || HOY, responsableId:d.responsableId,
             prioridad:"Media", estado:"Pendiente", canal:"Llamada"};
    S.recordatorios.unshift(r);
    pushEvento({pacienteId:d.pacienteId, fecha:HOY, tipo:"Recordatorio",
      titulo:"Tarea de seguimiento creada: "+d.proximaAccion,
      detalle:"Prevista para "+fechaCorta(r.fecha)+".", autor:USUARIA_ACTUAL});
  }
}

function registrarContacto(d){
  S.comunicaciones.unshift({id:nuevoId("COM"), pacienteId:d.pacienteId, fecha:HOY, canal:d.canal,
    resultado:d.resultado, nota:d.nota, registradoPorId:"PRO-03"});
  if(d.recordatorioId){
    var r = buscarRec(d.recordatorioId);
    if(r){ r.estado = "Completado"; r.nota = "Contacto: "+d.resultado; }
  }
  pushEvento({pacienteId:d.pacienteId, fecha:HOY, tipo:"Contacto", titulo:"Contacto · "+d.canal,
    detalle:"Resultado: "+d.resultado+(d.nota ? ". "+d.nota : ""), autor:USUARIA_ACTUAL});
}

function crearRecordatorio(d){
  var r = {id:nuevoId("REC"), tipo:d.tipo, categoria:d.categoria, pacienteId:d.pacienteId,
           motivo:d.motivo, fecha:d.fecha, responsableId:d.responsableId,
           prioridad:d.prioridad, estado:"Pendiente", canal:d.canal};
  S.recordatorios.unshift(r);
  if(r.pacienteId){
    pushEvento({pacienteId:r.pacienteId, fecha:HOY, tipo:"Recordatorio",
      titulo:"Recordatorio creado: "+r.tipo, detalle:r.motivo, autor:USUARIA_ACTUAL});
  }
  return r;
}

function actualizarRecordatorio(id, patch){
  var r = buscarRec(id); if(!r) return;
  var estadoAnterior = r.estado;
  for(var k in patch) if(Object.prototype.hasOwnProperty.call(patch,k)) r[k] = patch[k];
  if(r.pacienteId && patch.estado && patch.estado !== estadoAnterior){
    pushEvento({pacienteId:r.pacienteId, fecha:HOY, tipo:"Recordatorio",
      titulo:"Recordatorio "+String(patch.estado).toLowerCase()+": "+r.tipo,
      detalle: patch.motivoCancelacion ? "Motivo: "+patch.motivoCancelacion : undefined,
      autor:USUARIA_ACTUAL});
  }
}

function agregarDocumento(d){
  S.documentos.unshift({id:nuevoId("DOC"), pacienteId:d.pacienteId, tipo:d.tipo, titulo:d.titulo,
    fechaDocumento:d.fechaDocumento, fechaCarga:HOY, cargadoPorId:"PRO-03"});
  pushEvento({pacienteId:d.pacienteId, fecha:HOY, tipo:"Documento",
    titulo:"Documento cargado (simulado): "+d.titulo, autor:USUARIA_ACTUAL});
}

function pantallaInicio(){
  var citasHoy = S.citas.filter(function(c){
    return c.fecha === HOY && c.estado !== "Reagendada" && c.estado !== "Cancelada";
  }).sort(function(a,b){ return a.hora.localeCompare(b.hora); });

  var confirmadas = citasHoy.filter(function(c){ return c.estado === "Confirmada" || c.estado === "Completada"; });
  var porConfirmar = citasHoy.filter(function(c){ return c.estado === "Agendada"; });
  var pendientes = S.recordatorios.filter(function(r){ return r.estado === "Pendiente" && r.fecha <= HOY; });
  var atrasados = S.recordatorios.filter(function(r){ return r.estado === "Pendiente" && r.fecha < HOY; });

  var kpis = [[citasHoy.length,"Citas hoy"],[confirmadas.length,"Confirmadas"],
              [porConfirmar.length,"Por confirmar"],[pendientes.length,"Pendientes de hoy"]]
    .map(function(k){ return '<div class="tarjeta kpi"><b>'+k[0]+'</b><span>'+k[1]+'</span></div>'; }).join("");

  var listaCitas = citasHoy.map(function(c){
    var p = buscarPaciente(c.pacienteId);
    return '<button class="item-lista" data-act="ficha" data-arg="'+c.pacienteId+'">'+
      '<span class="fila" style="flex-wrap:nowrap">'+
        '<span class="hora-col">'+esc(c.hora)+'</span>'+
        '<span><span style="display:block;font-size:14px;font-weight:600;color:var(--s800)">'+
          esc(nombrePacienteId(c.pacienteId))+(p && p.esNuevo ? ' <span class="etq-nuevo">NUEVO</span>' : '')+'</span>'+
          '<span class="mini">'+esc(c.motivo)+' · '+esc(nombreProfCorto(c.profesionalId))+'</span></span>'+
      '</span>'+badgeEstado(c.estado)+'</button>';
  }).join("") || '<p class="vacio" style="border:none;background:none">No hay citas para hoy.</p>';

  var listaPend = pendientes.slice(0,5).map(function(r){
    var marca = r.fecha < HOY
      ? '<span style="color:var(--ro600);margin-top:2px">'+ico("alerta",15)+'</span>'
      : '<span style="margin-top:6px;width:10px;height:10px;flex:none;border-radius:999px;background:var(--marca-600);display:inline-block"></span>';
    return '<button class="item-lista" style="align-items:flex-start;justify-content:flex-start;gap:8px" data-act="ir-rec" data-arg="'+r.id+'">'+
      marca+'<span><span style="display:block;font-size:14px;font-weight:600;color:var(--s800)">'+
      esc(r.tipo)+(r.pacienteId ? " · "+esc(nombrePacienteId(r.pacienteId)) : "")+'</span>'+
      '<span class="mini">'+esc(r.motivo)+'</span></span></button>';
  }).join("") || '<p class="vacio" style="border:none;background:none">Sin pendientes para hoy.</p>';

  var avisos = alerta('1 garantía vence este mes (Rosa Cabascango — fechas ficticias para validación visual).');
  if(atrasados.length > 0){
    avisos += alerta(atrasados.length+' tarea'+(atrasados.length>1?'s':'')+' atrasada'+(atrasados.length>1?'s':'')+
      ' — la más antigua: Segundo Chalá, sin visita hace 14 meses (regla temporal por validar con Proaudio). '+
      '<a href="#" data-act="ir" data-arg="recordatorios" style="font-weight:700;text-decoration:underline">Ver recordatorios</a>');
  }

  return '<div class="pila">'+
    '<div class="fila-sep"><div><h1 class="t">Buenos días, Mónica</h1>'+
      '<p class="sub">'+esc(fechaLarga(HOY))+' · fecha ficticia de la demostración</p></div>'+
      '<div class="fila"><button class="btn-primario" data-act="modal-cita">'+ico("calendarioMas",16)+'Nueva cita</button>'+
      '<button class="btn-secundario" data-act="modal-paciente">'+ico("usuarioMas",16)+'Paciente nuevo</button></div></div>'+
    '<div class="rejilla4">'+kpis+'</div>'+
    '<div class="pila-sm">'+avisos+'</div>'+
    '<div class="rejilla2">'+
      '<section class="tarjeta"><div class="fila-sep" style="align-items:center;margin-bottom:10px">'+
        '<h2 class="t2" style="margin:0">Citas de hoy</h2>'+
        '<a href="#" data-act="ir" data-arg="agenda" class="enlace fila" style="gap:4px">Ver agenda completa '+ico("flechaDer",14)+'</a></div>'+
        '<div class="lista-div">'+listaCitas+'</div></section>'+

        '<div class="lista-div">'+listaPend+'</div></section>'+

function pantallaAgenda(){
  var A = UI.agenda;
  var audiologas = PROFESIONALES.filter(function(p){ return p.atiende; });
  var columnas = A.prof === "todos" ? audiologas : audiologas.filter(function(p){ return p.id === A.prof; });
  var filtradas = S.citas.filter(function(c){
    return (A.suc === "todas" || c.sucursalId === A.suc) && (A.prof === "todos" || c.profesionalId === A.prof);
  });

  var lunes = inicioSemana(A.fecha);
  var pf = partes(A.fecha);
  var diasEnMes = new Date(pf.y, pf.m, 0).getDate();
  var offset = (new Date(pf.y, pf.m-1, 1).getDay() + 6) % 7;

  var titulo = A.vista === "dia" ? fechaLarga(A.fecha)
             : A.vista === "semana" ? fechaCorta(lunes)+" – "+fechaCorta(sumarDias(lunes,5))
             : nombreMes(pf.m)+" "+pf.y;

  var controles =
    '<div class="fila">'+
      '<div class="grupo-btn">'+
        ['dia','semana','mes'].map(function(v){
          var t = v==='dia'?'Día':v==='semana'?'Semana':'Mes';
          return '<button data-act="ag-vista" data-arg="'+v+'" class="'+(A.vista===v?'on':'')+'">'+t+'</button>';
        }).join("")+
      '</div>'+
      '<div class="fila" style="gap:2px;border:1px solid var(--s300);background:#fff;border-radius:8px;padding:4px">'+
        '<button class="btn-suave" style="border:none" data-act="ag-mover" data-arg="-1" aria-label="Anterior">'+ico("chevIzq",16)+'</button>'+
        '<span style="min-width:190px;text-align:center;font-size:14px;font-weight:600;color:var(--s700)">'+esc(titulo)+'</span>'+
        '<button class="btn-suave" style="border:none" data-act="ag-mover" data-arg="1" aria-label="Siguiente">'+ico("chevDer",16)+'</button>'+
      '</div>'+
      '<button class="btn-suave" data-act="ag-hoy">Hoy</button>'+
      '<select class="campo auto" data-act="ag-suc">'+
        '<option value="todas"'+(A.suc==="todas"?" selected":"")+'>Todas las sucursales</option>'+
        SUCURSALES.map(function(s){ return '<option value="'+s.id+'"'+(A.suc===s.id?" selected":"")+'>'+esc(s.nombre)+'</option>'; }).join("")+
      '</select>'+
      '<select class="campo auto" data-act="ag-prof">'+
        '<option value="todos"'+(A.prof==="todos"?" selected":"")+'>Todas las profesionales</option>'+
        audiologas.map(function(p){ return '<option value="'+p.id+'"'+(A.prof===p.id?" selected":"")+'>'+esc(p.nombre)+'</option>'; }).join("")+
      '</select>'+
    '</div>';

  var cuerpo = "";

  if(A.vista === "dia"){
    var delDia = filtradas.filter(function(c){ return c.fecha === A.fecha; });
    var filas = SLOTS.map(function(slot){
      var celdas = columnas.map(function(p){
        var slotMin = +slot.slice(0,2)*60 + +slot.slice(3);
        var enSlot = delDia.filter(function(c){
          if(c.profesionalId !== p.id) return false;
          var cm = +c.hora.slice(0,2)*60 + +c.hora.slice(3);
          return cm >= slotMin && cm < slotMin + 30;
        });
        return '<td>'+enSlot.map(function(c){
          var tenue = (c.estado === "Cancelada" || c.estado === "Reagendada") ? " tenue" : "";
          return '<button class="bloque-cita'+tenue+'" style="border-left-color:'+p.borde+';background:'+p.fondo+'" '+
            'data-act="ag-abrir" data-arg="'+c.id+'"><b>'+esc(c.hora)+' · '+esc(nombrePacienteId(c.pacienteId))+'</b>'+
            '<span class="m"><span>'+esc(c.motivo)+'</span>'+badgeEstado(c.estado)+'</span></button>';
        }).join("")+'</td>';
      }).join("");
      return '<tr><td class="h">'+slot+'</td>'+celdas+'</tr>';
    }).join("");
    cuerpo = '<div class="tarjeta p0 scroll-x"><table class="agenda"><thead><tr><th class="h">Hora</th>'+
      columnas.map(function(p){ return '<th>'+esc(p.nombreCorto)+'</th>'; }).join("")+
      '</tr></thead><tbody>'+filas+'</tbody></table>'+
      (delDia.length === 0 ? '<div style="padding:16px">'+vacio("No hay citas este día con los filtros actuales.")+'</div>' : '')+
      '</div>';
  }

  if(A.vista === "semana"){
    cuerpo = '<div class="semana">'+[0,1,2,3,4,5].map(function(i){
      var d = sumarDias(lunes,i);
      var delDia = filtradas.filter(function(c){ return c.fecha === d && c.estado !== "Reagendada"; })
                            .sort(function(a,b){ return a.hora.localeCompare(b.hora); });
      return '<div class="tarjeta'+(d===HOY?' dia-hoy':'')+'" style="padding:12px">'+
        '<button style="width:100%;text-align:left;margin-bottom:8px" data-act="ag-dia" data-arg="'+d+'">'+
        '<b style="font-size:14px;color:var(--s700)">'+esc(fechaCorta(d))+'</b>'+
        '<span class="mini2" style="display:block">'+delDia.length+' cita'+(delDia.length!==1?'s':'')+' · ver día</span></button>'+
        '<div class="pila-sm">'+(delDia.map(function(c){
          return '<button style="display:block;width:100%;text-align:left;border-radius:6px;background:var(--s50);padding:6px 8px;font-size:12px" '+
            'data-act="ag-abrir" data-arg="'+c.id+'"><b>'+esc(c.hora)+'</b> '+esc(nombrePacienteId(c.pacienteId))+'</button>';
        }).join("") || '<p style="font-size:12px;color:var(--s300)">—</p>')+'</div></div>';
    }).join("")+'</div>';
  }

  if(A.vista === "mes"){
    var celdas = "";
    for(var i=0;i<offset;i++) celdas += '<div></div>';
    for(var d=1; d<=diasEnMes; d++){
      var iso = pf.y+"-"+String(pf.m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
      var n = filtradas.filter(function(c){ return c.fecha === iso && c.estado !== "Reagendada" && c.estado !== "Cancelada"; }).length;
      celdas += '<button class="celda-mes'+(iso===HOY?' hoy':'')+'" data-act="ag-dia" data-arg="'+iso+'">'+
        '<b>'+d+'</b>'+(n>0 ? '<span class="pastilla">'+n+' cita'+(n>1?'s':'')+'</span>' : '')+'</button>';
    }
    cuerpo = '<div class="tarjeta scroll-x"><div class="mes-cab">'+
      ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(function(x){ return '<div>'+x+'</div>'; }).join("")+
      '</div><div class="mes-rej">'+celdas+'</div></div>';
  }

  var leyenda = '<div class="tarjeta fila" style="padding:8px 16px;font-size:12px;color:var(--s500)">'+
    '<b style="color:var(--s600)">Estados:</b>'+
    ["Agendada","Confirmada","Completada","No atendida","Cancelada","Reagendada"].map(badgeEstado).join("")+'</div>';

  return '<div class="pila">'+
    '<div class="fila-sep"><h1 class="t">Agenda</h1>'+
      '<button class="btn-primario" data-act="modal-cita">'+ico("calendarioMas",16)+'Nueva cita</button></div>'+
    controles + cuerpo + leyenda + '</div>' + panelCita();
}

    '<button class="btn-secundario ancho-total" data-act="atencion" data-arg="'+c.pacienteId+'|'+c.id+'">Registrar atención</button>';

    acciones += '<button class="btn-secundario ancho-total" data-act="cita-confirmar" data-arg="'+c.id+'">Marcar confirmada</button>';

    acciones += '<button class="btn-secundario ancho-total" data-act="modal-reagendar" data-arg="'+c.id+'">Reagendar</button>'+
      '<button class="btn-secundario ancho-total" data-act="modal-noatendida" data-arg="'+c.id+'">Marcar no atendida</button>'+
      '<button class="btn-secundario ancho-total rojo" data-act="modal-cancelar-cita" data-arg="'+c.id+'">Cancelar cita</button>';
  }
  return '<div class="panel-fondo" data-cerrar-panel="1"><div class="panel">'+
    '<div class="fila-sep" style="align-items:flex-start;margin-bottom:16px">'+
      '<div><h2 style="font-size:18px;font-weight:700;color:var(--s800)">'+esc(nombrePacienteId(c.pacienteId))+'</h2>'+
      '<p class="sub">'+esc(fechaCorta(c.fecha))+' · '+esc(c.hora)+' · '+c.duracionMin+' min</p></div>'+
      '<button class="cerrar" data-act="cerrar-panel" aria-label="Cerrar">'+ico("equis",20)+'</button></div>'+
    '<div class="pila-sm" style="font-size:14px">'+
      '<p><b>Motivo:</b> '+esc(c.motivo)+'</p>'+
      '<p><b>Profesional:</b> '+esc(nombreProfLargo(c.profesionalId))+'</p>'+
      '<p><b>Sucursal:</b> '+esc((buscarSuc(c.sucursalId)||{}).nombre)+'</p>'+
      '<p class="fila"><b>Estado:</b> '+badgeEstado(c.estado)+'</p>'+
      (c.notas ? '<p><b>Notas:</b> '+esc(c.notas)+'</p>' : '')+
      (c.motivoCambio ? '<p style="color:var(--s500)"><b>Motivo registrado:</b> '+esc(c.motivoCambio)+'</p>' : '')+
    '</div><div class="pila-sm" style="margin-top:20px">'+acciones+'</div></div></div>';
}

/* =========================================================================
   8. PANTALLA — CENTRO DE RECORDATORIOS
   ========================================================================= */
var ICONO_CAT = {"Tarea para recepción":"telefono","Alerta para audióloga":"campana",
  "Recordatorio de cita":"relojCal","Comunicación futura al paciente":"mensaje"};
var CLASE_CAT = {"Tarea para recepción":"i-azul","Alerta para audióloga":"i-violeta",
  "Recordatorio de cita":"i-verde","Comunicación futura al paciente":"i-neutra"};

function pantallaRecordatorios(){
  var pend = S.recordatorios.filter(function(r){ return r.estado === "Pendiente"; });
  var g = {
    hoy: pend.filter(function(r){ return r.fecha === HOY; }),
    atrasados: pend.filter(function(r){ return r.fecha < HOY; }),
    proximos: pend.filter(function(r){ return r.fecha > HOY; }),
    completados: S.recordatorios.filter(function(r){ return r.estado === "Completado" || r.estado === "Cancelado"; })
  };
  var p = UI.recordatorios.pestania;
  var lista = p === "atrasados" ? g.atrasados.slice().sort(function(a,b){ return a.fecha.localeCompare(b.fecha); })
            : p === "hoy" ? g.atrasados.concat(g.hoy)
            : g[p].slice().sort(function(a,b){ return a.fecha.localeCompare(b.fecha); });

  var pestanias = [["hoy","Hoy ("+(g.hoy.length+g.atrasados.length)+")"],
                   ["atrasados","Atrasados ("+g.atrasados.length+")"],
                   ["proximos","Próximos ("+g.proximos.length+")"],
                   ["completados","Completados ("+g.completados.length+")"]]
    .map(function(x){ return '<button data-act="rec-pest" data-arg="'+x[0]+'" class="'+(p===x[0]?'on':'')+'">'+esc(x[1])+'</button>'; }).join("");

  var items = lista.map(function(r){
    var atrasado = r.estado === "Pendiente" && r.fecha < HOY;
    var clases = "tarjeta" + (UI.destacar === r.id ? " rec-destacado" : "") + (atrasado ? " rec-atrasado" : "");
    var cab = (atrasado ? '<span class="etq-atraso">ATRASADO · '+diasEntre(r.fecha,HOY)+' días</span>' : '')+
      '<span class="insignia '+(CLASE_CAT[r.categoria]||"i-neutra")+'">'+ico(ICONO_CAT[r.categoria]||"campana",13)+esc(r.categoria)+'</span>'+
      badgePrioridad(r.prioridad)+
      (String(r.canal).indexOf("Fase futura") >= 0 ? badgeFaseFutura("Envío externo: Fase futura") : "");
    var acciones = "";
    if(r.estado === "Pendiente"){
      acciones = '<div class="acciones-rec">'+
        (r.pacienteId ? '<button class="btn-suave" data-act="ficha" data-arg="'+r.pacienteId+'">Abrir ficha</button>' : '')+
        (r.pacienteId ? '<button class="btn-suave" data-act="modal-contacto-rec" data-arg="'+r.id+'">Registrar contacto</button>' : '')+
        '<button class="btn-suave" data-act="modal-editar-rec" data-arg="'+r.id+'">Editar</button>'+
        '<button class="btn-suave" data-act="modal-posponer" data-arg="'+r.id+'">Posponer</button>'+
        '<button class="btn-suave" data-act="modal-reasignar" data-arg="'+r.id+'">Reasignar</button>'+
        '<button class="btn-suave" data-act="rec-completar" data-arg="'+r.id+'">Completar</button>'+
        '<button class="btn-suave rojo" data-act="modal-cancelar-rec" data-arg="'+r.id+'">Cancelar</button>'+
      '</div>';
    }
    return '<div class="'+clases+'"><div class="fila">'+cab+'</div>'+
      '<h3 style="margin-top:6px;font-weight:700;color:var(--s800)">'+esc(r.tipo)+
        (r.pacienteId ? '<span style="font-weight:600;color:var(--s500)"> · '+esc(nombrePacienteId(r.pacienteId))+'</span>' : '')+'</h3>'+
      '<p style="margin-top:2px;font-size:14px;color:var(--s600)">'+esc(r.motivo)+'</p>'+
      '<p class="mini" style="margin-top:4px">'+ico("persona",12)+' Previsto: <b>'+esc(fechaCorta(r.fecha))+'</b> · Responsable: '+
        esc(nombreProfLargo(r.responsableId))+' · Canal sugerido: '+esc(r.canal)+' · Estado: '+esc(r.estado)+
        (r.motivoCancelacion ? ' (motivo: '+esc(r.motivoCancelacion)+')' : '')+'</p>'+
      (r.nota ? '<p class="mini" style="margin-top:4px;font-style:italic">Nota: '+esc(r.nota)+'</p>' : '')+
      acciones+'</div>';
  }).join("") || vacio("No hay elementos en esta pestaña.");

  return '<div class="pila">'+
    '<div class="fila-sep"><h1 class="t">Centro de recordatorios</h1>'+
      '<button class="btn-primario" data-act="modal-recordatorio">+ Recordatorio manual</button></div>'+
    alerta('La cantidad y priorización de tareas se configurará según la capacidad real del equipo. '+
           'Las tareas de esta lista son ejemplos ficticios para validar el concepto.')+
    '<div class="pestanias">'+pestanias+'</div>'+
    '<div class="pila">'+items+'</div></div>';
}

/* =========================================================================
   9. PANTALLA — LISTA DE PACIENTES
   ========================================================================= */
function pantallaPacientes(){
  var F = UI.pacientes;
  var nq = normalizar(F.q);
  var soloDigitos = nq.replace(/\D/g,"");
  var res = S.pacientes.filter(function(p){
    if(F.suc !== "todas" && p.sucursalId !== F.suc) return false;
    if(F.prof !== "todos" && p.profesionalId !== F.prof) return false;
    if(F.soloAlertas && !p.alerta) return false;
    if(!nq) return true;
    return normalizar(p.nombres+" "+p.apellidos).indexOf(nq) >= 0
        || normalizar(p.apellidos+" "+p.nombres).indexOf(nq) >= 0
        || (soloDigitos.length > 0 && p.telefono.replace(/\D/g,"").indexOf(soloDigitos) >= 0)
        || normalizar(p.documento||"").indexOf(nq) >= 0
        || normalizar(p.id).indexOf(nq) >= 0;
  });

  var filas = res.map(function(p){
    var prox = S.citas.filter(function(c){
      return c.pacienteId === p.id && c.fecha >= HOY && (c.estado === "Agendada" || c.estado === "Confirmada");
    }).sort(function(a,b){ return (a.fecha+a.hora).localeCompare(b.fecha+b.hora); })[0];
    var prof = buscarProf(p.profesionalId), suc = buscarSuc(p.sucursalId);
    return '<a href="#" class="ficha-item" data-act="ficha" data-arg="'+p.id+'"><div class="tarjeta">'+
      '<div class="fila-sep" style="align-items:flex-start"><div>'+
        '<div class="fila"><b style="color:var(--s800)">'+esc(p.apellidos)+', '+esc(p.nombres)+'</b>'+
          '<span class="mini2" style="font-weight:700">'+esc(p.id)+'</span>'+
          (p.esNuevo ? '<span class="etq-nuevo">NUEVO</span>' : '')+badgeCategoria(p.categoria)+'</div>'+
        '<div class="mini" style="margin-top:4px">'+ico("telefono",12)+' '+esc(p.telefono)+' · '+esc(suc?suc.nombre:"")+
          (prof ? ' · '+esc(prof.nombreCorto) : '')+' · Últ. visita: '+esc(fechaCorta(p.ultimaVisita))+
          ' · Próx. cita: '+(prox ? esc(fechaCorta(prox.fecha)+" "+prox.hora) : "—")+'</div>'+
        (p.alerta ? '<div style="margin-top:4px;font-size:12px;font-weight:600;color:var(--am800)">⚠ '+esc(p.alerta)+'</div>' : '')+
      '</div>'+badgeDigitalizacion(p.estadoDigitalizacion)+'</div></div></a>';
  }).join("") || vacio('No se encontraron pacientes con esos datos. '+
      '<button style="font-weight:700;color:var(--marca-700);text-decoration:underline" data-act="modal-paciente">Crear paciente nuevo</button>');

  return '<div class="pila">'+
    '<div class="fila-sep"><h1 class="t">Pacientes</h1>'+
      '<button class="btn-primario" data-act="modal-paciente">'+ico("usuarioMas",16)+'Paciente nuevo</button></div>'+
    '<div class="tarjeta pila-sm">'+
      '<div class="buscador" style="display:block">'+ico("lupa",16)+
        '<input id="busq-pac" class="campo" style="padding-left:34px" placeholder="Buscar por nombre, teléfono, documento o código (PAC-…)" value="'+esc(F.q)+'">'+
      '</div>'+
      '<div class="fila" style="font-size:14px">'+
        '<select class="campo auto" data-act="pac-suc">'+
          '<option value="todas"'+(F.suc==="todas"?" selected":"")+'>Todas las sucursales</option>'+
          SUCURSALES.map(function(s){ return '<option value="'+s.id+'"'+(F.suc===s.id?" selected":"")+'>'+esc(s.nombre)+'</option>'; }).join("")+
        '</select>'+
        '<select class="campo auto" data-act="pac-prof">'+
          '<option value="todos"'+(F.prof==="todos"?" selected":"")+'>Todas las profesionales</option>'+
          PROFESIONALES.filter(function(p){return p.atiende;}).map(function(p){
            return '<option value="'+p.id+'"'+(F.prof===p.id?" selected":"")+'>'+esc(p.nombre)+'</option>'; }).join("")+
        '</select>'+
        '<label class="fila" style="gap:6px;color:var(--s600)"><input type="checkbox" data-act="pac-alertas"'+
          (F.soloAlertas?" checked":"")+'> Solo con alertas</label>'+
        '<span class="mini2" style="margin-left:auto">'+res.length+' paciente'+(res.length!==1?'s':'')+' (datos ficticios)</span>'+
      '</div></div>'+
    '<div class="pila-sm">'+filas+'</div></div>';
}

  var contactos = S.comunicaciones.filter(function(c){ return c.pacienteId === p.id; });
  var prof = buscarProf(p.profesionalId), suc = buscarSuc(p.sucursalId);

  var encabezado = '<div class="tarjeta"><div class="fila-sep" style="align-items:flex-start">'+

      esc(p.nombres)+' '+esc(p.apellidos)+'</h1><span class="etq-cod">'+esc(p.id)+'</span>'+

      '<div class="sub" style="margin-top:4px">'+ico("telefono",13)+' '+esc(p.telefono)+
        (p.correo ? ' · ✉ '+esc(p.correo) : ' · ✉ (sin correo)')+' · 📍 '+esc(p.ciudad||"—")+' · '+esc(suc?suc.nombre:"")+'</div>'+
      '<div class="sub" style="margin-top:4px">Profesional responsable: <b>'+esc(prof?prof.nombre:"Sin asignar")+

    '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">'+badgeDigitalizacion(p.estadoDigitalizacion)+
      (p.ubicacionArchivo ? '<span class="mini2">Ficha física: '+esc(p.ubicacionArchivo)+'</span>' : '')+'</div>'+
    '</div>'+(p.alerta ? '<div style="margin-top:12px">'+alerta(esc(p.alerta))+'</div>' : '')+'</div>';

  var acciones = '<div class="fila">'+
    '<button class="btn-primario" data-act="modal-cita-pac" data-arg="'+p.id+'">'+ico("calendarioMas",16)+'Agendar cita</button>'+
    '<button class="btn-primario" data-act="atencion" data-arg="'+p.id+'|'+((prox && prox.fecha === HOY) ? prox.id : "")+'">'+
      ico("portapapeles",16)+'Registrar atención</button>'+
    '<button class="btn-secundario" data-act="modal-recordatorio-pac" data-arg="'+p.id+'">'+ico("campanaMas",16)+'Crear recordatorio</button>'+
    '<button class="btn-secundario" data-act="modal-contacto" data-arg="'+p.id+'">'+ico("telefono",16)+'Registrar contacto</button>'+
    '<button class="btn-secundario" data-act="modal-documento" data-arg="'+p.id+'">'+ico("subir",16)+'Adjuntar documento</button>'+

/* ── Posibles duplicados (paciente nuevo) ───────────────────────────────── */
function calcularDuplicados(nombres, apellidos, telefono, documento){
  var na = normalizar(apellidos), nn = normalizar(nombres);
  var nt = String(telefono||"").replace(/\D/g,""), nd = normalizar(documento);
  if(na.length < 3 && nt.length < 7 && nd.length < 5) return [];
  return S.pacientes.filter(function(p){
    var ca = na.length >= 3 && normalizar(p.apellidos).indexOf(na) >= 0;
    var cn = nn.length >= 3 && normalizar(p.nombres).indexOf(nn) >= 0;
    var ct = nt.length >= 7 && p.telefono.replace(/\D/g,"").indexOf(nt) >= 0;
    var cd = nd.length >= 5 && normalizar(p.documento||"").indexOf(nd) >= 0;
    return ca || (cn && ca) || ct || cd;
  });
}
function htmlDuplicados(){
  var D = UI.modalDatos;
  if(D.descartarAviso) return "";
  var dup = calcularDuplicados(D.nombres, D.apellidos, D.telefono, D.documento);
  if(dup.length === 0) return "";
  return '<div class="aviso-dup"><div class="fila" style="margin-bottom:8px;font-size:14px;font-weight:600;color:var(--am900)">'+
    ico("alerta",16)+'¿Es alguna de estas personas? (advertencia — la fusión nunca es automática)</div>'+
    dup.slice(0,3).map(function(p){
      return '<div class="dup-item"><div><b>'+esc(p.apellidos)+', '+esc(p.nombres)+'</b> '+
        '<span style="color:var(--s500)">· '+esc(p.id)+' · '+esc(p.telefono)+' · últ. visita '+esc(fechaCorta(p.ultimaVisita))+'</span></div>'+
        '<button class="btn-suave" data-act="usar-ficha" data-arg="'+p.id+'">Usar esta ficha</button></div>';
    }).join("")+
    '<button style="margin-top:6px;font-size:12px;font-weight:700;color:var(--am800);text-decoration:underline" '+
    'data-act="descartar-dup">No, es una persona distinta — continuar</button></div>';
}

/* =========================================================================
   13. RENDERIZADO Y NAVEGACIÓN
   ========================================================================= */
var app = document.getElementById("app");

function pantallaActual(){
  switch(UI.ruta){
    case "agenda":        return pantallaAgenda();
    case "recordatorios": return pantallaRecordatorios();
    case "pacientes":     return pantallaPacientes();
    case "ficha":         return pantallaFicha();
    case "atencion":      return pantallaAtencion();
    default:              return pantallaInicio();
  }
}

function render(){
  var activo = document.activeElement;
  var idActivo = activo && activo.id ? activo.id : null;
  var pos = null;
  if(idActivo && activo.selectionStart !== undefined && activo.selectionStart !== null){
    try { pos = activo.selectionStart; } catch(e){ pos = null; }
  }

  app.innerHTML = cabecera() + '<main>' + pantallaActual() + '</main>' + renderModal();

  if(idActivo){
    var nuevo = document.getElementById(idActivo);
    if(nuevo && typeof nuevo.focus === "function"){
      nuevo.focus();
      if(pos !== null && nuevo.setSelectionRange){
        try { nuevo.setSelectionRange(pos, pos); } catch(e){}
      }
    }
  }
  window.scrollTo(0, UI.scrollY || 0);
}

UI.historial = [];
function instantanea(){
  return {ruta:UI.ruta, pacienteId:UI.pacienteId, citaIdParam:UI.citaIdParam,
          destacar:UI.destacar, pestania:UI.ficha.pestania};
}
function irA(ruta, opciones){
  UI.historial.push(instantanea());
  if(UI.historial.length > 30) UI.historial.shift();
  UI.ruta = ruta;
  UI.pacienteId = opciones && opciones.pacienteId ? opciones.pacienteId : null;
  UI.citaIdParam = opciones && opciones.citaId ? opciones.citaId : null;
  UI.destacar = opciones && opciones.destacar ? opciones.destacar : null;
  UI.ficha.pestania = "Resumen";
  UI.ficha.filtroTl = "Todo";
  UI.agenda.citaAbierta = null;
  /* Al entrar a la agenda desde el menú siempre se aterriza en el día de hoy. */
  if(ruta === "agenda"){ UI.agenda.fecha = HOY; UI.agenda.vista = "dia"; }
  /* La lista de pacientes se limpia, salvo que venga del buscador de la cabecera. */
  if(ruta === "pacientes" && !(opciones && opciones.mantenerBusqueda)) UI.pacientes.q = "";
  UI.scrollY = 0;
  UI.modalDatos = {};
  UI.modalError = "";
  render();
}
function volver(){
  var s = UI.historial.pop();
  if(s){
    UI.ruta = s.ruta; UI.pacienteId = s.pacienteId; UI.citaIdParam = s.citaIdParam;
    UI.destacar = s.destacar; UI.ficha.pestania = s.pestania || "Resumen";
  } else {
    UI.ruta = "inicio"; UI.pacienteId = null;
  }
  UI.agenda.citaAbierta = null; UI.modal = null; UI.modalDatos = {}; UI.modalError = ""; UI.scrollY = 0;
  render();
}
function abrirModal(tipo, datos){
  capturarPantalla();
  UI.modal = tipo;
  UI.modalDatos = datos || {};
  UI.modalError = "";
  render();
}
function cerrarModal(){
  UI.modal = null; UI.modalDatos = {}; UI.modalError = ""; render();
}

/* ── Captura de lo escrito antes de volver a dibujar ─────────────────────── */
function val(id){ var e = document.getElementById(id); return e ? e.value : undefined; }
function chk(id){ var e = document.getElementById(id); return e ? e.checked : undefined; }
function fijar(D, clave, id){ var v = val(id); if(v !== undefined) D[clave] = v; }

function capturarModal(){
  var D = UI.modalDatos;
  if(!UI.modal) return;
  if(UI.modal === "paciente"){
    fijar(D,"nombres","pf-nombres"); fijar(D,"apellidos","pf-apellidos");
    fijar(D,"telefono","pf-telefono"); fijar(D,"sucursalId","pf-suc");
    fijar(D,"documento","pf-doc"); fijar(D,"telefono2","pf-tel2"); fijar(D,"correo","pf-correo");
    fijar(D,"ciudad","pf-ciudad"); fijar(D,"fechaNacimiento","pf-nac"); fijar(D,"comoConocio","pf-como");
    fijar(D,"referidoPor","pf-ref"); fijar(D,"profesionalId","pf-prof");
    fijar(D,"fichaFisica","pf-ficha"); fijar(D,"notas","pf-notas");
    var a = chk("pf-agendar"); if(a !== undefined) D.agendarDespues = a;
  }
  if(UI.modal === "cita"){
    fijar(D,"busqueda","cf-busq"); fijar(D,"fecha","cf-fecha"); fijar(D,"hora","cf-hora");
    var d = val("cf-dur"); if(d !== undefined) D.duracion = +d;
    fijar(D,"sucursalId","cf-suc"); fijar(D,"profesionalId","cf-prof");
    fijar(D,"motivo","cf-motivo"); fijar(D,"notas","cf-notas");
  }
  if(UI.modal === "contacto"){ fijar(D,"nota","ct-nota"); fijar(D,"fechaOtra","ct-fecha"); }
  if(UI.modal === "motivo"){ fijar(D,"texto","mo-texto"); }
  if(UI.modal === "reagendar"){ fijar(D,"fecha","rg-fecha"); fijar(D,"hora","rg-hora");
    fijar(D,"profesionalId","rg-prof"); fijar(D,"otro","rg-otro"); }
  if(UI.modal === "recordatorio"){ fijar(D,"tipo","rf-tipo"); fijar(D,"motivo","rf-motivo");
    fijar(D,"fecha","rf-fecha"); fijar(D,"prioridad","rf-prio"); fijar(D,"responsableId","rf-resp"); }
  if(UI.modal === "documento"){ fijar(D,"tipo","dc-tipo"); fijar(D,"titulo","dc-titulo"); fijar(D,"fechaDoc","dc-fecha"); }
  if(UI.modal === "editarRec"){ fijar(D,"motivo","er-motivo"); fijar(D,"fecha","er-fecha"); fijar(D,"prioridad","er-prio"); }
  if(UI.modal === "posponer"){ fijar(D,"fecha","pp-fecha"); }
  if(UI.modal === "reasignar"){ fijar(D,"responsableId","rs-resp"); }
  if(UI.modal === "editarPac"){ fijar(D,"telefono","ep-tel"); fijar(D,"ciudad","ep-ciudad"); fijar(D,"notas","ep-notas"); }
}
function capturarPantalla(){
  if(UI.ruta === "atencion" && !UI.modal){
    var D = UI.modalDatos;
    fijar(D,"tipo","at-tipo"); fijar(D,"observacion","at-obs"); fijar(D,"indicacion","at-ind");
    fijar(D,"proximaAccion","at-proxima"); fijar(D,"fechaSeguimiento","at-fecha");
    fijar(D,"responsableId","at-resp");
  }
}
function capturarTodo(){ if(UI.modal) capturarModal(); else capturarPantalla(); }

/* =========================================================================
   14. EVENTOS
   ========================================================================= */
document.addEventListener("click", function(ev){
  var cerrarFondo = ev.target.getAttribute && ev.target.getAttribute("data-cerrar-modal");
  if(cerrarFondo){ capturarModal(); cerrarModal(); return; }
  var cerrarPanel = ev.target.getAttribute && ev.target.getAttribute("data-cerrar-panel");
  if(cerrarPanel){ UI.agenda.citaAbierta = null; render(); return; }

  var nodo = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if(!nodo) return;
  var act = nodo.getAttribute("data-act");
  var arg = nodo.getAttribute("data-arg");
  if(nodo.tagName === "SELECT") return;      // los selects se tratan en "change"
  if(nodo.tagName === "A") ev.preventDefault();
  UI.scrollY = window.scrollY;

  switch(act){

    /* ── Navegación ─────────────────────────────────────────────────── */
    case "ir":        irA(arg); break;
    case "volver":    volver(); break;
    case "ficha":     irA("ficha", {pacienteId:arg}); break;
    case "atencion": {
      var t = String(arg).split("|");
      irA("atencion", {pacienteId:t[0], citaId:t[1] || null});
      break;
    }
    case "ir-rec":    irA("recordatorios", {destacar:arg}); break;

    /* ── Agenda ─────────────────────────────────────────────────────── */
    case "ag-vista":  UI.agenda.vista = arg; render(); break;
    case "ag-hoy":    UI.agenda.fecha = HOY; render(); break;
    case "ag-dia":    UI.agenda.fecha = arg; UI.agenda.vista = "dia"; render(); break;
    case "ag-abrir":  UI.agenda.citaAbierta = arg; render(); break;
    case "cerrar-panel": UI.agenda.citaAbierta = null; render(); break;
    case "ag-mover": {
      var dir = +arg;
      if(UI.agenda.vista === "dia") UI.agenda.fecha = sumarDias(UI.agenda.fecha, dir);
      else if(UI.agenda.vista === "semana") UI.agenda.fecha = sumarDias(UI.agenda.fecha, 7*dir);
      else {
        var pm = partes(UI.agenda.fecha);
        UI.agenda.fecha = aISO(new Date(pm.y, pm.m-1+dir, 1));
      }
      render(); break;
    }
    case "cita-confirmar": cambiarEstadoCita(arg, "Confirmada"); render(); break;

    /* ── Pestañas ───────────────────────────────────────────────────── */
    case "ficha-pest": UI.ficha.pestania = arg; render(); break;
    case "tl-filtro":  UI.ficha.filtroTl = arg; render(); break;
    case "rec-pest":   UI.recordatorios.pestania = arg; UI.destacar = null; render(); break;

    /* ── Apertura de modales ────────────────────────────────────────── */
    case "modal-paciente":
      abrirModal("paciente", {nombres:"",apellidos:"",telefono:"",sucursalId:"SUC-01",
        documento:"",telefono2:"",correo:"",ciudad:"",fechaNacimiento:"",comoConocio:"",
        referidoPor:"",profesionalId:"",fichaFisica:"",notas:"",
        verOpcionales:false, agendarDespues:true, descartarAviso:false});
      break;
    case "modal-cita":
      abrirModal("cita", {pacienteId:null, busqueda:"", fecha:HOY, hora:"09:00", duracion:30,
        sucursalId:"SUC-01", profesionalId:"PRO-01", motivo:MOTIVOS_CITA[1], notas:""});
      break;
    case "modal-cita-pac": {
      var pp = buscarPaciente(arg);
      abrirModal("cita", {pacienteId:arg, fijo:true, busqueda:"", fecha:HOY, hora:"09:00", duracion:30,
        sucursalId:pp ? pp.sucursalId : "SUC-01",
        profesionalId:(pp && pp.profesionalId) ? pp.profesionalId : "PRO-01",
        motivo:MOTIVOS_CITA[1], notas:""});
      break;
    }
    case "modal-contacto":
      abrirModal("contacto", {pacienteId:arg, canal:"Llamada", resultado:"", nota:"",
        seguimiento:"no", fechaOtra:sumarDias(HOY,7)});
      break;
    case "modal-contacto-rec": {
      var rr = buscarRec(arg);
      abrirModal("contacto", {pacienteId:rr.pacienteId, recordatorioId:rr.id, canal:"Llamada",
        resultado:"", nota:"", seguimiento:"no", fechaOtra:sumarDias(HOY,7)});
      break;
    }
    case "modal-recordatorio":
      abrirModal("recordatorio", {tipo:"Llamada humana pendiente", motivo:"", fecha:HOY,
        prioridad:"Media", responsableId:"PRO-03"});
      break;
    case "modal-recordatorio-pac":
      abrirModal("recordatorio", {pacienteId:arg, tipo:"Llamada humana pendiente", motivo:"",
        fecha:HOY, prioridad:"Media", responsableId:"PRO-03"});
      break;
    case "modal-documento":
      abrirModal("documento", {pacienteId:arg, archivo:"", tipo:TIPOS_DOCUMENTO[0], titulo:"", fechaDoc:""});
      break;
    case "modal-reagendar":
      abrirModal("reagendar", {citaId:arg, fecha:"", hora:"", profesionalId:"", motivo:"", otro:""});
      break;
    case "modal-cancelar-cita": {
      var cc = buscarCita(arg);
      abrirModal("motivo", {titulo:"Cancelar cita", accion:"cancelar-cita", citaId:arg,
        descripcion: cc ? nombrePacienteId(cc.pacienteId)+" · "+fechaCorta(cc.fecha)+" "+cc.hora : "",
        etiquetaBoton:"Cancelar la cita",
        opciones:["Solicitado por el paciente","Solicitado por Proaudio","Otro"], opcion:"", texto:""});
      break;
    }
    case "modal-noatendida":
      abrirModal("motivo", {titulo:"Marcar cita como no atendida", accion:"no-atendida", citaId:arg,
        descripcion:"Se registrará la inasistencia. Se sugiere crear una tarea de seguimiento desde la ficha.",
        etiquetaBoton:"Marcar no atendida",
        opciones:["No asistió, sin aviso previo","Avisó que no podía asistir","Otro"], opcion:"", texto:""});
      break;
    case "modal-cancelar-rec": {
      var rc = buscarRec(arg);
      abrirModal("motivo", {titulo:"Cancelar recordatorio", accion:"cancelar-rec", recId:arg,
        descripcion: rc ? rc.tipo+(rc.pacienteId ? " · "+nombrePacienteId(rc.pacienteId) : "") : "",
        etiquetaBoton:"Cancelar recordatorio", texto:""});
      break;
    }
    case "modal-editar-rec": {
      var re = buscarRec(arg);
      abrirModal("editarRec", {recId:arg, motivo:re.motivo, fecha:re.fecha, prioridad:re.prioridad});
      break;
    }
    case "modal-posponer": {
      var rp = buscarRec(arg);
      abrirModal("posponer", {recId:arg, fecha: rp.fecha > HOY ? rp.fecha : HOY});
      break;
    }
    case "modal-reasignar": {
      var rz = buscarRec(arg);
      abrirModal("reasignar", {recId:arg, responsableId:rz.responsableId});
      break;
    }
    case "modal-editar-pac": {
      var pe = buscarPaciente(arg);
      abrirModal("editarPac", {pacienteId:arg, telefono:pe.telefono, ciudad:pe.ciudad||"", notas:pe.notas||""});
      break;
    }
    case "cerrar-modal": capturarModal(); cerrarModal(); break;

    /* ── Formulario de paciente ─────────────────────────────────────── */
    case "pf-opcionales":
      capturarModal(); UI.modalDatos.verOpcionales = !UI.modalDatos.verOpcionales; render(); break;
    case "descartar-dup":
      capturarModal(); UI.modalDatos.descartarAviso = true; render(); break;
    case "usar-ficha":
      /* Nunca se fusionan fichas: solo se abre la existente. */
      cerrarModal();
      irA("ficha", {pacienteId:arg});
      break;
    case "pf-guardar": {
      capturarModal();
      var Dp = UI.modalDatos;
      if(!String(Dp.nombres||"").trim() || !String(Dp.apellidos||"").trim() || !String(Dp.telefono||"").trim()){
        UI.modalError = "Nombres, apellidos y teléfono principal son obligatorios."; render(); break;
      }
      var nuevoPac = crearPaciente({
        nombres:Dp.nombres.trim(), apellidos:Dp.apellidos.trim(), telefono:Dp.telefono.trim(),
        sucursalId:Dp.sucursalId, documento:(Dp.documento||"").trim(), telefono2:(Dp.telefono2||"").trim(),
        correo:(Dp.correo||"").trim(), ciudad:(Dp.ciudad||"").trim(), fechaNacimiento:Dp.fechaNacimiento,
        comoConocio:Dp.comoConocio, referidoPor:(Dp.referidoPor||"").trim(),
        profesionalId:Dp.profesionalId, fichaFisica:(Dp.fichaFisica||"").trim(), notas:(Dp.notas||"").trim()
      });
      var quiereAgendar = Dp.agendarDespues;
      cerrarModal();
      if(quiereAgendar){
        abrirModal("cita", {pacienteId:nuevoPac.id, fijo:true, busqueda:"", fecha:HOY, hora:"09:00",
          duracion:30, sucursalId:nuevoPac.sucursalId, profesionalId:nuevoPac.profesionalId||"PRO-01",
          motivo:MOTIVOS_CITA[0], notas:""});
      } else irA("ficha", {pacienteId:nuevoPac.id});
      break;
    }

    /* ── Formulario de cita ─────────────────────────────────────────── */
    case "cf-elegir": {
      capturarModal();
      var px = buscarPaciente(arg);
      UI.modalDatos.pacienteId = arg;
      UI.modalDatos.sucursalId = px.sucursalId;
      if(px.profesionalId) UI.modalDatos.profesionalId = px.profesionalId;
      render(); break;
    }
    case "cf-cambiar":
      capturarModal(); UI.modalDatos.pacienteId = null; UI.modalDatos.busqueda = ""; render(); break;
    case "cf-guardar": {
      capturarModal();
      var Dc = UI.modalDatos;
      if(!Dc.pacienteId){ UI.modalError = "Seleccione un paciente. Toda cita está vinculada a una ficha."; render(); break; }
      if(!Dc.fecha || !Dc.hora){ UI.modalError = "La fecha y la hora son obligatorias."; render(); break; }
      var citaNueva = crearCita({pacienteId:Dc.pacienteId, fecha:Dc.fecha, hora:Dc.hora,
        duracionMin:Dc.duracion, profesionalId:Dc.profesionalId, sucursalId:Dc.sucursalId,
        motivo:Dc.motivo, notas:(Dc.notas||"").trim()});
      cerrarModal();
      irA("ficha", {pacienteId:citaNueva.pacienteId});
      break;
    }

    /* ── Contacto ───────────────────────────────────────────────────── */
    case "ct-canal":     capturarModal(); UI.modalDatos.canal = arg; render(); break;
    case "ct-resultado": capturarModal(); UI.modalDatos.resultado = arg; render(); break;
    case "ct-seg":       capturarModal(); UI.modalDatos.seguimiento = arg; render(); break;
    case "ct-guardar": {
      capturarModal();
      var Dt = UI.modalDatos;
      if(!Dt.resultado){ UI.modalError = "Seleccione el resultado del contacto."; render(); break; }
      registrarContacto({pacienteId:Dt.pacienteId, canal:Dt.canal, resultado:Dt.resultado,
        nota:(Dt.nota||"").trim(), recordatorioId:Dt.recordatorioId});
      if(Dt.seguimiento !== "no"){
        crearRecordatorio({tipo:"Llamada de seguimiento", categoria:"Tarea para recepción",
          pacienteId:Dt.pacienteId, motivo:"Nuevo intento de contacto (resultado anterior: "+Dt.resultado+").",
          fecha: Dt.seguimiento === "7dias" ? sumarDias(HOY,7) : Dt.fechaOtra,
          responsableId:"PRO-03", prioridad:"Media", canal:"Llamada"});
      }
      var agendo = Dt.resultado === "Agendó cita";
      var pacCt = Dt.pacienteId;
      cerrarModal();
      if(agendo){
        var pc = buscarPaciente(pacCt);
        abrirModal("cita", {pacienteId:pacCt, fijo:true, busqueda:"", fecha:HOY, hora:"09:00", duracion:30,
          sucursalId:pc.sucursalId, profesionalId:pc.profesionalId||"PRO-01", motivo:MOTIVOS_CITA[1], notas:""});
      }
      break;
    }

    /* ── Motivo genérico ────────────────────────────────────────────── */
    case "mo-opcion": capturarModal(); UI.modalDatos.opcion = arg; render(); break;
    case "mo-confirmar": {
      capturarModal();
      var Dm = UI.modalDatos;
      var motivo = Dm.opciones ? (Dm.opcion === "Otro" ? String(Dm.texto||"").trim() : Dm.opcion)
                               : String(Dm.texto||"").trim();
      if(!motivo){ UI.modalError = "El motivo es obligatorio. Queda registrado en el historial."; render(); break; }
      if(Dm.accion === "cancelar-cita") cambiarEstadoCita(Dm.citaId, "Cancelada", motivo);
      if(Dm.accion === "no-atendida")   cambiarEstadoCita(Dm.citaId, "No atendida", motivo);
      if(Dm.accion === "cancelar-rec")  actualizarRecordatorio(Dm.recId, {estado:"Cancelado", motivoCancelacion:motivo});
      cerrarModal(); break;
    }

    /* ── Reagendar ──────────────────────────────────────────────────── */
    case "rg-opcion": capturarModal(); UI.modalDatos.motivo = arg; render(); break;
    case "rg-confirmar": {
      capturarModal();
      var Dr = UI.modalDatos;
      var cr = buscarCita(Dr.citaId);
      var mr = Dr.motivo === "Otro" ? String(Dr.otro||"").trim() : Dr.motivo;
      if(!mr){ UI.modalError = "Seleccione el motivo del reagendamiento."; render(); break; }
      reagendarCita(Dr.citaId, {fecha:Dr.fecha || cr.fecha, hora:Dr.hora || cr.hora,
        profesionalId:Dr.profesionalId || cr.profesionalId}, mr);
      cerrarModal(); break;
    }

    /* ── Recordatorios ──────────────────────────────────────────────── */
    case "rec-completar": actualizarRecordatorio(arg, {estado:"Completado"}); render(); break;
    case "rf-guardar": {
      capturarModal();
      var Df = UI.modalDatos;
      if(!String(Df.motivo||"").trim()){ UI.modalError = "Describa el motivo del recordatorio."; render(); break; }
      crearRecordatorio({tipo:Df.tipo,
        categoria: Df.responsableId === "PRO-03" ? "Tarea para recepción" : "Alerta para audióloga",
        pacienteId:Df.pacienteId, motivo:Df.motivo.trim(), fecha:Df.fecha,
        responsableId:Df.responsableId, prioridad:Df.prioridad, canal:"Llamada"});
      cerrarModal(); break;
    }
    case "er-guardar": {
      capturarModal();
      var De = UI.modalDatos;
      actualizarRecordatorio(De.recId, {motivo:De.motivo, fecha:De.fecha, prioridad:De.prioridad});
      cerrarModal(); break;
    }
    case "pp-guardar": {
      capturarModal();
      var Dpp = UI.modalDatos;
      actualizarRecordatorio(Dpp.recId, {fecha:Dpp.fecha, nota:"Pospuesto para "+fechaCorta(Dpp.fecha)+"."});
      cerrarModal(); break;
    }
    case "rs-guardar": {
      capturarModal();
      actualizarRecordatorio(UI.modalDatos.recId, {responsableId:UI.modalDatos.responsableId});
      cerrarModal(); break;
    }

    /* ── Documento ──────────────────────────────────────────────────── */
    case "doc-archivo":
      capturarModal();
      UI.modalDatos.archivo = UI.modalDatos.archivo ? "" : "documento-demo-"+(Date.now()%1000)+".pdf";
      render(); break;
    case "dc-guardar": {
      capturarModal();
      var Dd = UI.modalDatos;
      if(!String(Dd.titulo||"").trim()){ UI.modalError = "El título del documento es obligatorio."; render(); break; }
      agregarDocumento({pacienteId:Dd.pacienteId, tipo:Dd.tipo,
        titulo:Dd.titulo.trim()+" (documento ficticio)", fechaDocumento:Dd.fechaDoc || HOY});
      cerrarModal(); break;
    }

    /* ── Editar paciente ────────────────────────────────────────────── */
    case "ep-guardar": {
      capturarModal();
      var Dx = UI.modalDatos;
      var pz = buscarPaciente(Dx.pacienteId);
      if(pz){ pz.telefono = Dx.telefono; pz.ciudad = Dx.ciudad || undefined; pz.notas = Dx.notas || undefined; }
      cerrarModal(); break;
    }

    /* ── Registro de atención ───────────────────────────────────────── */
    case "at-adjunto":
      capturarPantalla();
      UI.modalDatos.adjunto = UI.modalDatos.adjunto ? "" : "audiometria-demo-"+(Date.now()%1000)+".pdf";
      render(); break;
    case "at-sinseg":
      capturarPantalla();
      UI.modalDatos.sinSeguimiento = !UI.modalDatos.sinSeguimiento;
      render(); break;
    case "at-guardar": {
      capturarPantalla();
      var Da = UI.modalDatos;
      if(!String(Da.observacion||"").trim()){
        UI.modalError = "La observación es obligatoria (es el único campo imprescindible)."; render(); break;
      }
      if(!Da.sinSeguimiento && !String(Da.proximaAccion||"").trim()){
        UI.modalError = 'Defina la próxima acción o marque "No requiere seguimiento". Es el punto donde se previene el abandono.';
        render(); break;
      }
      var idPac = UI.pacienteId;
      registrarAtencion({pacienteId:idPac, citaId: arg || undefined, tipo:Da.tipo,
        observacion:Da.observacion.trim(), indicacion:String(Da.indicacion||"").trim(),
        proximaAccion: Da.sinSeguimiento ? "" : Da.proximaAccion.trim(),
        fechaSeguimiento: Da.sinSeguimiento ? undefined : Da.fechaSeguimiento,
        responsableId:Da.responsableId, documentoAdjunto:Da.adjunto || undefined});
      UI.modalDatos = {}; UI.modalError = "";
      irA("ficha", {pacienteId:idPac});
      break;
    }
  }
});

/* ── Selects y casillas ─────────────────────────────────────────────────── */
document.addEventListener("change", function(ev){
  var nodo = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if(!nodo) return;
  var act = nodo.getAttribute("data-act");
  UI.scrollY = window.scrollY;
  switch(act){
    case "ag-suc":      UI.agenda.suc = nodo.value; render(); break;
    case "ag-prof":     UI.agenda.prof = nodo.value; render(); break;
    case "pac-suc":     UI.pacientes.suc = nodo.value; render(); break;
    case "pac-prof":    UI.pacientes.prof = nodo.value; render(); break;
    case "pac-alertas": UI.pacientes.soloAlertas = nodo.checked; render(); break;
  }
});

/* ── Escritura en tiempo real ───────────────────────────────────────────── */
document.addEventListener("input", function(ev){
  var t = ev.target;
  if(!t || !t.id) {
    /* Aviso de duplicados: se actualiza solo esa zona, sin redibujar el modal */
    if(t && t.classList && t.classList.contains("dup-watch")) actualizarZonaDuplicados();
    return;
  }
  if(t.id === "busq-pac"){
    UI.pacientes.q = t.value;
    UI.scrollY = window.scrollY;
    render();
    return;
  }
  if(t.id === "cf-busq"){
    UI.modalDatos.busqueda = t.value;
    UI.scrollY = window.scrollY;
    render();
    return;
  }
  if(t.classList && t.classList.contains("dup-watch")) actualizarZonaDuplicados();
});

function actualizarZonaDuplicados(){
  if(UI.modal !== "paciente") return;
  capturarModal();
  var zona = document.getElementById("zona-dup");
  if(zona) zona.innerHTML = htmlDuplicados();
}

/* ── Buscador de la cabecera (Enter) ────────────────────────────────────── */
document.addEventListener("keydown", function(ev){
  if(ev.target && ev.target.id === "busq-cab" && ev.key === "Enter"){
    ev.preventDefault();
    UI.busquedaCabecera = ev.target.value;
    UI.pacientes.q = ev.target.value;
    irA("pacientes", {mantenerBusqueda:true});
    return;
  }
  if(ev.key === "Escape"){
    if(UI.modal){ capturarModal(); cerrarModal(); }
    else if(UI.agenda.citaAbierta){ UI.agenda.citaAbierta = null; render(); }
  }
});

/* =========================================================================
   15. ARRANQUE
   ========================================================================= */
render();

</script>
